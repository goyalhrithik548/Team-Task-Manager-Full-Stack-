{% extends "base.html" %}

{% block title %}Access Denied | Team Task Manager{% endblock %}

{% block content %}
<div class="empty-state">
    <h1 class="h3 fw-bold mb-2">Access denied</h1>
    <p class="text-muted mb-4">You do not have permission to perform this action.</p>
    <a href="{{ url_for('main.dashboard') if current_user else url_for('auth.login') }}" class="btn btn-primary">Go back</a>
</div>
{% endblock %}

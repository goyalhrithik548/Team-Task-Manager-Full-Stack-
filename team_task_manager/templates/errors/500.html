{% extends "base.html" %}

{% block title %}Server Error | Team Task Manager{% endblock %}

{% block content %}
<div class="empty-state">
    <h1 class="h3 fw-bold mb-2">Something went wrong</h1>
    <p class="text-muted mb-4">The server hit an unexpected issue. Please try the action again.</p>
    <a href="{{ url_for('main.dashboard') if current_user else url_for('auth.login') }}" class="btn btn-primary">Go back</a>
</div>
{% endblock %}

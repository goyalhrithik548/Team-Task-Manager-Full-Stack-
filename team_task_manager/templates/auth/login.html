{% extends "base.html" %}

{% block title %}Login | Team Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card auth-card shadow-sm border-0">
            <div class="card-body p-4 p-lg-5">
                <p class="eyebrow">Welcome back</p>
                <h1 class="h3 fw-bold mb-3">Log in to your workspace</h1>
                <p class="text-muted mb-4">Use the seeded admin account or a member account to explore the dashboard.</p>

                <form method="post" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <p class="text-muted small mt-4 mb-0">
                    Need an account?
                    <a href="{{ url_for('auth.signup') }}" class="text-decoration-none">Create a member account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

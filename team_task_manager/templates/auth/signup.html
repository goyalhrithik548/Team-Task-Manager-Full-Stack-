{% extends "base.html" %}

{% block title %}Signup | Team Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card auth-card shadow-sm border-0">
            <div class="card-body p-4 p-lg-5">
                <p class="eyebrow">New member</p>
                <h1 class="h3 fw-bold mb-3">Create your account</h1>
                <p class="text-muted mb-4">For demo simplicity, new signups are created as <strong>MEMBER</strong> accounts.</p>

                <form method="post" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="full_name" class="form-label">Full name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Aisha Khan" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="aisha@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label">Confirm password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">Create Account</button>
                </form>

                <p class="text-muted small mt-4 mb-0">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Log in here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
